<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Shape Wizard Adventure</title>
    <style>
        :root {
            --jungle-green: #2ecc71;
            --wizard-purple: #9b59b6;
            --gold: #f1c40f;
        }

        body {
            margin: 0;
            background: #1a1a1a;
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            touch-action: manipulation;
        }

        #game-container {
            position: relative;
            width: 100%;
            max-width: 800px;
            aspect-ratio: 16 / 9;
            background: var(--jungle-green);
            border: 8px solid #34495e;
            border-radius: 15px;
            overflow: hidden;
            transition: background 0.5s;
        }

        /* --- MOVING BACKGROUND OBJECTS --- */
        .bg-obj {
            position: absolute;
            font-size: 2rem;
            opacity: 0.4;
            animation: move linear infinite;
            pointer-events: none;
        }

        @keyframes move {
            from { transform: translateX(-100px); }
            to { transform: translateX(900px); }
        }

        /* --- FLOATING STAR ANIMATION --- */
        .floating-star {
            position: absolute;
            color: var(--gold);
            font-weight: bold;
            font-size: 2rem;
            pointer-events: none;
            animation: floatUp 1s ease-out forwards;
            z-index: 100;
        }

        @keyframes floatUp {
            0% { transform: translateY(0); opacity: 1; }
            100% { transform: translateY(-100px); opacity: 0; }
        }

        .screen {
            position: absolute;
            width: 100%; height: 100%;
            display: none; flex-direction: column;
            justify-content: center; align-items: center;
            text-align: center; color: white;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            z-index: 5;
        }

        .active { display: flex; }

        /* --- UI ELEMENTS --- */
        #hud {
            position: absolute;
            top: 10px; width: 100%;
            display: flex; justify-content: space-around;
            font-size: 1.2rem; font-weight: bold; z-index: 10;
        }

        #timer-container {
            position: absolute;
            bottom: 20px; width: 80%;
            height: 15px; background: rgba(0,0,0,0.3);
            border-radius: 10px; overflow: hidden;
        }

        #timer-bar {
            width: 100%; height: 100%;
            background: #e74c3c; transition: width 0.1s linear;
        }

        button {
            padding: 15px 30px; font-size: 1.2rem;
            cursor: pointer; background: var(--wizard-purple);
            color: white; border: none; border-radius: 50px;
            box-shadow: 0 5px #7d3c98; margin: 10px;
        }

        .char-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; }
        .char-card { background: rgba(255,255,255,0.2); padding: 10px; border-radius: 10px; cursor: pointer; border: 3px solid transparent; }
        .char-card.selected { border-color: var(--gold); background: rgba(255,255,255,0.4); }

        #shape-stage { display: flex; gap: 40px; margin-top: 20px; }
        .game-shape { width: 120px; height: 120px; cursor: pointer; filter: drop-shadow(0 5px 5px rgba(0,0,0,0.3)); transition: 0.2s; }
        .game-shape:active { transform: scale(0.9); }
    </style>
</head>
<body>

<div id="game-container">
    <div id="bg-layer"></div>

    <div id="hud">
        <div id="stats-stars">⭐ Stars: 0</div>
        <div id="stats-lives">❤️ Lives: 3</div>
    </div>

    <div id="start-menu" class="screen active">
        <h1>✨ Shape Wizard ✨</h1>
        <button onclick="showScreen('char-select')">PLAY</button>
    </div>

    <div id="char-select" class="screen">
        <h2>Pick a Buddy</h2>
        <div class="char-grid">
            <div class="char-card" onclick="selectChar('🐰')"><h1>🐰</h1></div>
            <div class="char-card" onclick="selectChar('🐼')"><h1>🐼</h1></div>
            <div class="char-card" onclick="selectChar('🦕')"><h1>🦕</h1></div>
            <div class="char-card" onclick="selectChar('🦄')"><h1>🦄</h1></div>
        </div>
        <button onclick="showScreen('world-map')" id="to-map-btn" style="display:none;">GO!</button>
    </div>

    <div id="world-map" class="screen"></div>

    <div id="game-screen" class="screen">
        <h2 id="instruction">Find the Circle!</h2>
        <div id="shape-stage"></div>
        <div id="timer-container"><div id="timer-bar"></div></div>
    </div>
</div>

<script>
    let gameState = JSON.parse(localStorage.getItem('shapeWizardData')) || {
        stars: 0, lives: 3, character: '🐰', currentWorld: 'jungle'
    };
    
    let timer;
    let timeLeft = 30;
    const shapes = ['circle', 'square', 'triangle', 'star'];

    // --- CREATE MOVING BACKGROUND ---
    function createBackground() {
        const bgLayer = document.getElementById('bg-layer');
        bgLayer.innerHTML = '';
        const icons = gameState.currentWorld === 'jungle' ? ['🍃', '☁️', '🦜'] : ['⭐', '☄️', '☁️'];
        for(let i=0; i<6; i++) {
            const div = document.createElement('div');
            div.className = 'bg-obj';
            div.innerText = icons[Math.floor(Math.random()*icons.length)];
            div.style.top = Math.random() * 80 + "%";
            div.style.animationDuration = (Math.random() * 10 + 5) + "s";
            div.style.animationDelay = (Math.random() * 5) + "s";
            bgLayer.appendChild(div);
        }
    }

    function showScreen(screenId) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(screenId).classList.add('active');
        if(screenId === 'world-map') renderWorldMap();
        if(screenId !== 'game-screen') clearInterval(timer);
    }

    function renderWorldMap() {
        const map = document.getElementById('world-map');
        map.innerHTML = `<h2>Select World</h2>`;
        const worlds = [
            {id:'jungle', name:'🌴 Jungle', cost:0, color:'#27ae60'},
            {id:'space', name:'🚀 Space', cost:50, color:'#2c3e50'}
        ];
        worlds.forEach(w => {
            const btn = document.createElement('button');
            btn.innerText = gameState.stars >= w.cost ? w.name : `🔒 ${w.cost}⭐`;
            btn.onclick = () => {
                if(gameState.stars >= w.cost) {
                    gameState.currentWorld = w.id;
                    document.getElementById('game-container').style.background = w.color;
                    createBackground();
                    startGame();
                }
            };
            map.appendChild(btn);
        });
    }

    function selectChar(emoji) {
        gameState.character = emoji;
        document.querySelectorAll('.char-card').forEach(c => c.classList.remove('selected'));
        event.currentTarget.classList.add('selected');
        document.getElementById('to-map-btn').style.display = 'block';
    }

    function startGame() {
        showScreen('game-screen');
        timeLeft = 30;
        startTimer();
        nextLevel();
    }

    function startTimer() {
        clearInterval(timer);
        timer = setInterval(() => {
            timeLeft -= 0.1;
            document.getElementById('timer-bar').style.width = (timeLeft / 30 * 100) + "%";
            if(timeLeft <= 0) {
                clearInterval(timer);
                alert("Time's up! Let's try again!");
                showScreen('world-map');
            }
        }, 100);
    }

    function nextLevel() {
        const stage = document.getElementById('shape-stage');
        stage.innerHTML = '';
        const target = shapes[Math.floor(Math.random() * shapes.length)];
        gameState.currentShape = target;
        document.getElementById('instruction').innerText = `${gameState.character} says: Find the ${target.toUpperCase()}!`;

        let options = [...shapes].sort(() => 0.5 - Math.random()).slice(0, 3);
        if(!options.includes(target)) options[0] = target;
        options.sort(() => 0.5 - Math.random()).forEach(s => {
            const div = document.createElement('div');
            div.className = 'game-shape';
            div.innerHTML = getShapeSVG(s);
            div.onclick = (e) => checkAnswer(s, e);
            stage.appendChild(div);
        });
    }

    function checkAnswer(selected, event) {
        if (selected === gameState.currentShape) {
            gameState.stars += 10;
            timeLeft = Math.min(timeLeft + 2, 30); // Bonus time for correct answer!
            spawnStar(event.clientX, event.clientY);
            updateHUD();
            nextLevel();
        } else {
            gameState.lives--;
            updateHUD();
            if(gameState.lives <= 0) {
                alert("Game Over!");
                gameState.lives = 3;
                showScreen('start-menu');
            }
        }
    }

    function spawnStar(x, y) {
        const star = document.createElement('div');
        star.className = 'floating-star';
        star.innerHTML = '⭐ +10';
        star.style.left = (x - 50) + 'px';
        star.style.top = (y - 50) + 'px';
        document.body.appendChild(star);
        setTimeout(() => star.remove(), 1000);
    }

    function updateHUD() {
        document.getElementById('stats-stars').innerText = `⭐ Stars: ${gameState.stars}`;
        document.getElementById('stats-lives').innerText = `❤️ Lives: ${gameState.lives}`;
        localStorage.setItem('shapeWizardData', JSON.stringify(gameState));
    }

    function getShapeSVG(type) {
        const colors = {circle: '#e74c3c', square: '#ffffff', triangle: '#2ecc71', star: '#f1c40f'};
        if(type === 'circle') return `<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="40" fill="${colors.circle}"/></svg>`;
        if(type === 'square') return `<svg viewBox="0 0 100 100"><rect x="10" y="10" width="80" height="80" fill="${colors.square}"/></svg>`;
        if(type === 'triangle') return `<svg viewBox="0 0 100 100"><polygon points="50,10 90,90 10,90" fill="${colors.triangle}"/></svg>`;
        if(type === 'star') return `<svg viewBox="0 0 100 100"><polygon points="50,5 63,35 95,35 70,55 80,85 50,70 20,85 30,55 5,35 37,35" fill="${colors.star}"/></svg>`;
    }

    updateHUD();
    createBackground();
</script>
